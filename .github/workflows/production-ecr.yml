name: Build and Deploy Production

on:
  push:
    branches:
      - main


  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy image to production EC2"
        required: true
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: kokki-production-backend
  AWS_ACCOUNT_ID: "841627029654"
  EC2_INSTANCE_ID: i-065101e6d2e436ed3

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::841627029654:role/KokkiProductionGitHubDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy to production EC2
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy == true)
        shell: bash
        run: |
          IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${GITHUB_SHA}"
          --parameters commands="[
            \"aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com\",

            \"docker pull ${IMAGE}\",

            \"PREVIOUS_IMAGE=\$(docker inspect --format='{{.Config.Image}}' kokki-production-backend 2>/dev/null || true); echo \\"\$PREVIOUS_IMAGE\\" > /tmp/kokki-previous-image; echo \\"Previous image: \$PREVIOUS_IMAGE\\"\",

            \"docker rm -f kokki-production-backend || true\",

            \"docker run -d --name kokki-production-backend --restart unless-stopped --env-file /opt/kokki/.env.production -v /opt/kokki/certs/rds-global-bundle.pem:/app/certs/rds-global-bundle.pem:ro -p 127.0.0.1:3000:3000 ${IMAGE}\",

            \"HEALTHY=false; for i in \$(seq 1 12); do STATUS=\$(docker inspect --format='{{.State.Health.Status}}' kokki-production-backend 2>/dev/null || echo unavailable); echo \\"Health check \$i/12: \$STATUS\\"; if [ \\"\$STATUS\\" = \\"healthy\\" ]; then HEALTHY=true; break; fi; sleep 5; done; if [ \\"\$HEALTHY\\" != \\"true\\" ]; then echo 'New deployment failed health check. Starting rollback...'; docker logs --tail 100 kokki-production-backend || true; PREVIOUS_IMAGE=\$(cat /tmp/kokki-previous-image); docker rm -f kokki-production-backend || true; if [ -z \\"\$PREVIOUS_IMAGE\\" ]; then echo 'ERROR: No previous image available for rollback'; exit 1; fi; echo \\"Rolling back to \$PREVIOUS_IMAGE\\"; docker run -d --name kokki-production-backend --restart unless-stopped --env-file /opt/kokki/.env.production -v /opt/kokki/certs/rds-global-bundle.pem:/app/certs/rds-global-bundle.pem:ro -p 127.0.0.1:3000:3000 \\"\$PREVIOUS_IMAGE\\"; ROLLBACK_HEALTHY=false; for i in \$(seq 1 12); do STATUS=\$(docker inspect --format='{{.State.Health.Status}}' kokki-production-backend 2>/dev/null || echo unavailable); echo \\"Rollback health check \$i/12: \$STATUS\\"; if [ \\"\$STATUS\\" = \\"healthy\\" ]; then ROLLBACK_HEALTHY=true; break; fi; sleep 5; done; if [ \\"\$ROLLBACK_HEALTHY\\" = \\"true\\" ]; then echo 'Rollback successful. Previous production version restored.'; else echo 'CRITICAL: Rollback container is unhealthy'; docker logs --tail 100 kokki-production-backend || true; fi; exit 1; fi; echo 'Deployment health check passed.'\"
          ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"